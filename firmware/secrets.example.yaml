# Copy to secrets.yaml (it is git-ignored) and fill in. The ESP32-C3 needs a 2.4 GHz network.
wifi_ssid: "your-network"
wifi_password: "your-password"
ap_password: "at-least-8-characters"
# 32 random bytes in base64, e.g.:  python -c "import secrets,base64;print(base64.b64encode(secrets.token_bytes(32)).decode())"
api_key: "paste-the-generated-key-here"
